name: ci

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10" ]
        poetry-version: [ "1.8.3" ]
        os: [ "ubuntu-latest" ]
    runs-on: ${{ matrix.os }}
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4

      - name: Install poetry
        uses: abatilo/actions-poetry@v2

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run python ./webapp/manage.py test core
