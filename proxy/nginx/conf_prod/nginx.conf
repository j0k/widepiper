server {
    listen 80;
    listen [::]:80;

    server_name tg.ma8ka.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tg.ma8ka.com$request_uri;
    }
}

