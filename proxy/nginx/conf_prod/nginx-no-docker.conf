# Nginx config for widepiper without Docker (tg.ma8ka.com)
# Copy to /etc/nginx/sites-available/ and:
# 1. Replace /var/www/widepiper with your repo path (e.g. /home/user/space/widepiper)
# 2. sudo ln -s /etc/nginx/sites-available/widepiper /etc/nginx/sites-enabled/
# 3. For SSL: run certbot first, then use the server block from nginx-no-docker-ssl.conf

upstream django_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    server_name tg.ma8ka.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /var/www/widepiper/staticfiles/;
    }
}
