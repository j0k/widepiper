# Nginx SSL config for widepiper without Docker (tg.ma8ka.com)
# Use after obtaining certs: sudo certbot certonly --webroot -w /var/www/certbot -d tg.ma8ka.com
# Replace /var/www/widepiper with your repo path.

upstream django_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    server_name tg.ma8ka.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://tg.ma8ka.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name tg.ma8ka.com;

    ssl_certificate /etc/letsencrypt/live/tg.ma8ka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.ma8ka.com/privkey.pem;

    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /static/ {
        alias /var/www/widepiper/staticfiles/;
    }
}
